[project]
name = "doodle-to-cad"
version = "0.1.0"
description = "Local-first agentic doodle to OpenSCAD and STL pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.0",
  "networkx>=3.3",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "trimesh>=4.4",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doodle_to_cad*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
