<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: var(--app-font, system-ui); color: var(--foreground); margin: 0; padding: 10px 12px; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 12px; margin-bottom: 10px; }
  .imgs { display: flex; gap: 10px; }

  #send:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 11px; color: var(--muted-foreground); margin-top: 6px; }
</style></head>
