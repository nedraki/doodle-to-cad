<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: var(--app-font, system-ui); color: var(--foreground); margin: 0; padding: 10px 12px; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 12px; margin-bottom: 10px; }
  .imgs { display: flex; gap: 10px; }
  figure { margin: 0; text-align: center; }
  figure img { width: 210px; height: 210px; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  figcaption { font-size: 12px; color: var(--muted-foreground); margin-top: 3px; }
  .grades { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
  .grp label { display: block; font-size: 12px; color: var(--muted-foreground); margin-bottom: 4px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--card); }
  #send { margin-top: 14px; padding: 7px 16px; border-radius: 8px; border: none; background: var(--accent); color: var(--card); font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 11px; color: var(--muted-foreground); margin-top: 6px; }
</style></head>

  <div class="grp"><label>Grade A</label><div class="btns" data-g="A">
    <button>stars</button><button>pass</button><button>almost</button><button>fail</button></div></div>
  <div class="grp"><label>Grade B</label><div class="btns" data-g="B">
    <button>stars</button><button>pass</button><button>almost</button><button>fail</button></div></div>
  <div class="grp"><label>Winner</label><div class="btns" data-g="W">
    <button>A</button><button>B</button><button>tie</button><button>both-fail</button></div></div>
</div>
<button id="send" disabled>Submit verdict</button>
<div class="hint">Or just type it in chat: “case 2: A stars, B fail, winner A”.</div>
<script>
const sel = {A:null,B:null,W:null};
document.querySelectorAll('.btns').forEach(g=>{
  g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); sel[g.dataset.g]=b.textContent;
    document.getElementById('send').disabled=!(sel.A&&sel.B&&sel.W);
  }));
});
document.getElementById('send').addEventListener('click',()=>{
  window.hermes.send("REVIEW case-2: A=" + sel.A + " B=" + sel.B + " winner=" + sel.W);
  document.getElementById('send').disabled = true;
  document.getElementById('send').textContent = "Sent — waiting for next case";
});
</script>
</body></html>
